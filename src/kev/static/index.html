<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0e0c" />
  <title>KEV SYSTEM ZERO POINT ONE</title>
  <style>
    :root {
      --bg: #0c0e0c;
      --rail: #121512;
      --panel: #181b16;
      --ink: #eceee6;
      --dim: #8b9580;
      --line: #2a3126;
      --phos: #c6f04a;
      --amber: #e6a12a;
      --hot: #ff5a3c;
      --cool: #6fd0c2;
      --track: #1a1e16;
      --field: #101310;
      --you: #232820;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--ink);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    button, textarea, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: transparent; }
    textarea { resize: none; }
    a { color: var(--dim); }
    input, select {
      width: 100%; background: var(--field); border: 1px solid var(--line);
      border-radius: 10px; padding: .55rem .7rem; outline: none;
    }
    textarea.field {
      width: 100%; background: var(--field); border: 1px solid var(--line);
      border-radius: 10px; padding: .55rem .7rem; outline: none; resize: vertical;
    }
    input:focus, textarea:focus, select:focus { border-color: #4a5638; }
    .app { display: grid; grid-template-columns: 16.5rem minmax(0, 1fr); height: 100%; }
    .rail {
      background: var(--rail); border-right: 1px solid var(--line);
      display: flex; flex-direction: column; padding: .85rem .7rem 1rem; min-height: 0;
    }
    .new {
      width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 12px;
      padding: .7rem .85rem; background: var(--panel);
    }
    .new:hover { border-color: var(--phos); }
    .rail-k {
      margin: 1.1rem .35rem .4rem; color: var(--dim); font-size: .7rem;
      letter-spacing: .14em; text-transform: uppercase;
    }
    .tape { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: .2rem; }
    .tape button {
      text-align: left; width: 100%; border-radius: 10px; padding: .55rem .7rem;
      font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tape button:hover { background: var(--panel); }
    .tape span { display: block; color: var(--dim); font-size: .72rem; }
    .rail-foot {
      margin-top: .7rem; padding: .7rem .45rem 0; border-top: 1px solid var(--line);
      color: var(--dim); font-size: .75rem;
    }
    .mark { color: var(--phos); letter-spacing: .28em; font-weight: 600; }
    .sub { display: block; letter-spacing: .12em; font-size: .62rem; margin: .2rem 0 .55rem; }
    .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    header.top {
      display: flex; align-items: center; justify-content: space-between; gap: .8rem;
      flex-wrap: wrap; padding: .7rem 1.1rem;
    }
    .brand { display: flex; align-items: center; gap: .65rem; flex-wrap: wrap; }
    .word { font-weight: 650; letter-spacing: .22em; font-size: .95rem; }
    .pill {
      font-size: .68rem; letter-spacing: .1em; text-transform: uppercase;
      color: var(--dim); border: 1px solid var(--line); border-radius: 999px;
      padding: .14rem .55rem; max-width: 16rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .pill.ok { color: var(--phos); border-color: #3d4a22; }
    .pill.bad { color: var(--hot); border-color: var(--hot); }
    .pills { display: flex; gap: .3rem; flex-wrap: wrap; }
    .pills button, .ghost {
      border: 1px solid var(--line); border-radius: 999px; padding: .32rem .75rem;
      color: var(--dim); font-size: .82rem;
    }
    .pills button[aria-selected="true"], .ghost.on {
      border-color: var(--phos); color: var(--bg); background: var(--phos);
    }
    .ghost:hover { border-color: #4a5638; color: var(--ink); }
    .ghost.danger:hover { border-color: var(--hot); color: var(--hot); }
    .feed { flex: 1; overflow: auto; padding: 1rem 1.1rem 0; }
    .hello {
      min-height: min(28rem, calc(100% - 2rem));
      display: grid; place-content: center; text-align: center; gap: .55rem;
    }
    .hello.gone { display: none; }
    .logo {
      color: var(--phos); letter-spacing: .42em; font-weight: 700;
      font-size: 1.7rem; margin-bottom: .3rem;
    }
    .hello h1 { margin: 0; font-size: 1.7rem; font-weight: 600; letter-spacing: -.02em; }
    .hello p { margin: 0 auto; max-width: 26rem; color: var(--dim); }
    .turn { max-width: 46rem; margin: 0 auto 1.4rem; display: grid; gap: .85rem; }
    .you { display: flex; justify-content: flex-end; }
    .bubble {
      max-width: min(36rem, 92%);
      background: var(--you); border-radius: 22px;
      padding: .85rem 1.05rem; white-space: pre-wrap; word-break: break-word;
    }
    .verdict h2 { margin: .1rem 0 .35rem; font-size: 1.35rem; font-weight: 600; letter-spacing: -.02em; }
    .verdict.go h2 { color: var(--phos); }
    .verdict.hold h2 { color: var(--amber); }
    .verdict.stop h2 { color: var(--hot); }
    .who { color: var(--dim); font-size: .72rem; letter-spacing: .08em; }
    .why { margin: 0; color: var(--dim); font-size: .9rem; }
    .steps { margin: .65rem 0 0; padding: 0; list-style: none; display: grid; gap: .28rem; }
    .meters { display: grid; gap: .55rem; margin-top: .2rem; }
    .card {
      border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
      padding: .75rem .85rem .85rem;
    }
    .card header { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: .5rem; }
    .id { color: var(--dim); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; }
    .readout { font-size: 1.05rem; }
    .noul-track, .bar { height: .55rem; background: var(--track); border-radius: 99px; overflow: hidden; }
    .noul-track { position: relative; overflow: visible; }
    .noul-fill, .bar > i { display: block; height: 100%; background: var(--phos); border-radius: 99px; font-style: normal; }
    .bar > i { background: var(--cool); }
    .noul-rule { position: absolute; top: -3px; bottom: -3px; width: 1px; left: 80%; background: var(--amber); }
    .bar-row { display: grid; grid-template-columns: 7.2rem 1fr 2.8rem; gap: .45rem; align-items: center; font-size: .78rem; margin-top: .28rem; }
    .bar-row.win .lab { color: var(--phos); }
    .bar-row.win i { background: var(--phos); }
    .score-track { position: relative; height: 2rem; border-radius: 10px; border: 1px solid var(--line); background: var(--track); display: flex; margin-top: .15rem; }
    .score-track span { flex: 1; color: var(--dim); font-size: .68rem; display: flex; align-items: flex-end; justify-content: center; padding-bottom: .2rem; }
    .needle { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--hot); transform: translateX(-1px); }
    .conf { color: var(--dim); font-size: .75rem; margin: .45rem 0 0; }
    .err { color: var(--hot); }
    details.wire { margin-top: .75rem; color: var(--dim); font-size: .78rem; }
    details.wire summary { cursor: pointer; letter-spacing: .06em; }
    details.wire pre {
      margin: .5rem 0 0; padding: .75rem .85rem; background: var(--bg);
      border: 1px solid var(--line); border-radius: 12px; overflow: auto; color: var(--ink);
      font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
      white-space: pre-wrap; word-break: break-word;
    }
    .composer { padding: .4rem 1.1rem calc(.9rem + env(safe-area-inset-bottom)); }
    .box {
      max-width: 46rem; margin: 0 auto;
      display: grid; grid-template-columns: 1fr auto;
      align-items: end; gap: .55rem;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 28px; padding: .55rem .55rem .55rem 1.05rem;
    }
    .box:focus-within { border-color: #4a5638; }
    #state {
      width: 100%; min-height: 1.5rem; max-height: 10rem;
      background: transparent; color: var(--ink); border: 0;
      padding: .45rem 0; outline: none;
    }
    .judge {
      min-width: 5.6rem; min-height: 2.5rem; border-radius: 999px;
      background: var(--phos); color: #14160f; font-weight: 650; letter-spacing: .06em;
    }
    .judge[disabled] { opacity: .4; cursor: wait; }
    .checks, .hint {
      max-width: 46rem; margin: .45rem auto 0;
      color: var(--dim); font-size: .75rem; text-align: center;
    }
    details.advanced {
      max-width: 46rem; margin: .55rem auto 0; color: var(--dim); font-size: .78rem;
    }
    details.advanced > summary { cursor: pointer; text-align: center; letter-spacing: .06em; }
    .adv {
      margin-top: .7rem; padding: .85rem .9rem 1rem;
      border: 1px solid var(--line); border-radius: 16px; background: var(--panel);
      display: grid; gap: .7rem; text-align: left;
    }
    .row { display: flex; align-items: center; justify-content: space-between; gap: .6rem; flex-wrap: wrap; }
    .bar-actions { display: flex; gap: .4rem; flex-wrap: wrap; }
    .qlist { display: grid; gap: .7rem; }
    .q {
      border: 1px solid var(--line); border-radius: 14px; background: var(--bg); padding: .75rem .8rem .85rem;
    }
    .q header { display: grid; grid-template-columns: minmax(6rem, 1fr) 7.2rem auto; gap: .4rem; margin-bottom: .55rem; }
    .q .qins { min-height: 4.2rem; margin-bottom: .55rem; }
    .poles, .opts, .lvls { display: grid; gap: .4rem; }
    .poles { grid-template-columns: 1fr 1fr; }
    .pole, .opt, .lvl { display: grid; gap: .35rem; }
    .opt { grid-template-columns: 8.5rem minmax(0, 1fr) auto; align-items: center; }
    .lvl { grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
    .pole span { color: var(--dim); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; }
    .add-line { justify-self: start; }
    .meta-line { margin: 0; color: var(--dim); font-size: .75rem; }
    #busy, #state-label, #limit-pill, #auth-pill { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      .rail { display: none; }
      .hello h1 { font-size: 1.35rem; }
      .q header, .poles, .opt { grid-template-columns: 1fr; }
      .bar-row { grid-template-columns: 1fr 2.8rem; }
      .bar-row .lab { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <button type="button" class="new" id="new">New decision</button>
      <p class="rail-k">Recent</p>
      <div class="tape" id="tape"></div>
      <div class="rail-foot">
        <span class="mark">KEV</span>
        <span class="sub">SYSTEM ZERO POINT ONE</span>
        <a href="/docs">API</a>
      </div>
    </aside>
    <div class="stage">
      <header class="top">
        <div class="brand">
          <span class="word">KEV</span>
          <span class="pill" id="health-pill">…</span>
          <span class="pill" id="model-pill">model</span>
          <span class="pill" id="limit-pill">32 q · 255 opt</span>
          <span class="pill" id="auth-pill">open</span>
        </div>
      </header>
      <main class="feed" id="feed">
        <div class="hello" id="hello">
          <div class="logo">KEV</div>
          <h1>What should happen?</h1>
          <p>Paste anything. KEV returns a routing call — act, wait, hold.</p>
        </div>
        <div id="instruments"></div>
      </main>
      <div class="composer">
        <label class="k" for="state" id="state-label">Text</label>
        <div class="box">
          <textarea id="state" rows="1" spellcheck="false" placeholder="Paste anything."></textarea>
          <button type="button" class="judge" id="judge">Decide</button>
        </div>
        <p class="checks" id="checks">Whether to act, wait, or hand to a person.</p>
        <p class="hint">A person can override. Wrong calls still happen.</p>
        <details class="advanced" id="advanced">
          <summary>Advanced</summary>
          <div class="adv">
            <div class="row">
              <div class="pills" id="state-mode">
                <button type="button" id="mode-text" aria-selected="true">Text</button>
                <button type="button" id="mode-json">JSON</button>
              </div>
              <div class="bar-actions">
                <button type="button" class="ghost" id="sample">Sample</button>
                <button type="button" class="ghost" id="export">Export</button>
                <button type="button" class="ghost" id="import">Import</button>
                <input id="import-file" type="file" accept="application/json,.json" hidden />
              </div>
            </div>
            <div class="row">
              <label>Pack
                <select id="decks"></select>
              </label>
              <label>Model
                <input id="model" spellcheck="false" placeholder="Bound server model" />
              </label>
            </div>
            <div class="row">
              <div class="bar-actions">
                <button type="button" class="ghost" id="add-noul">Add Noul</button>
                <button type="button" class="ghost" id="add-choice">Add Choice</button>
                <button type="button" class="ghost" id="add-score">Add Score</button>
              </div>
              <p class="meta-line" id="pack-meta">0 / 32 questions</p>
            </div>
            <p class="meta-line" id="state-meta">0 characters</p>
            <div class="qlist" id="qlist"></div>
          </div>
        </details>
        <span id="busy"></span>
      </div>
    </div>
  </div>

  <script>
    const YES = 0.80;
    const NO = 0.20;
    const CLEAR = 0.40;
    const DEFAULT_LIMITS = { max_questions: 32, max_options: 255, max_state_chars: 24000 };
    const DEFAULT_QUESTIONS = {
      actionable: {
        type: "noul",
        instructions: "Is there a clear action to take from this text?",
        criteria: {
          true: "A specific next step is asked for or required",
          false: "Informational, thanks, or nothing to do"
        }
      },
      next: {
        type: "choice",
        instructions: "What should happen next?",
        criteria: { act: "do the thing", wait: "park it", person: "a human should see this", ignore: "nothing to do" }
      },
      urgency: { type: "score", instructions: "How soon?", criteria: ["later", "soon", "now"] }
    };

    const stateEl = document.getElementById("state");
    const qlistEl = document.getElementById("qlist");
    const instrumentsEl = document.getElementById("instruments");
    const helloEl = document.getElementById("hello");
    const feedEl = document.getElementById("feed");
    const judgeBtn = document.getElementById("judge");
    const tapeEl = document.getElementById("tape");
    const busyEl = document.getElementById("busy");
    const checksEl = document.getElementById("checks");
    const modelEl = document.getElementById("model");
    const importFile = document.getElementById("import-file");
    const tape = [];
    let questions = clone(DEFAULT_QUESTIONS);
    let order = Object.keys(questions);
    let deckId = "general";
    let decks = [];
    let stateMode = "text";
    let limits = { ...DEFAULT_LIMITS };

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }
    function escapeText(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }
    function grow() {
      stateEl.style.height = "auto";
      stateEl.style.height = Math.min(stateEl.scrollHeight, 160) + "px";
    }
    function nextId(prefix) {
      let n = 1;
      let id = prefix;
      while (questions[id]) {
        n += 1;
        id = prefix + "_" + n;
      }
      return id;
    }
    function blankQuestion(type) {
      if (type === "noul") {
        return { type: "noul", instructions: "Is this true?", criteria: { true: "", false: "" } };
      }
      if (type === "choice") {
        return { type: "choice", instructions: "Pick one.", criteria: { a: "", b: "" } };
      }
      return { type: "score", instructions: "How far?", criteria: ["low", "high"] };
    }
    function noulPoles(criteria) {
      const src = criteria && typeof criteria === "object" ? criteria : {};
      const yes = src.true || src.yes || src.YES || src.True || "";
      const no = src.false || src.no || src.NO || src.False || "";
      return { yes: String(yes || ""), no: String(no || "") };
    }
    function setLimits(next) {
      limits = {
        max_questions: Number(next.max_questions) || DEFAULT_LIMITS.max_questions,
        max_options: Number(next.max_options) || DEFAULT_LIMITS.max_options,
        max_state_chars: Number(next.max_state_chars) || DEFAULT_LIMITS.max_state_chars
      };
      document.getElementById("limit-pill").textContent =
        limits.max_questions + " q · " + limits.max_options + " opt";
      paintMeta();
    }
    function paintMeta() {
      document.getElementById("state-meta").textContent =
        stateEl.value.length.toLocaleString() + " / " + limits.max_state_chars.toLocaleString() + " characters";
      document.getElementById("pack-meta").textContent =
        order.length + " / " + limits.max_questions + " questions";
    }
    function setStateMode(mode) {
      stateMode = mode;
      document.getElementById("mode-text").setAttribute("aria-selected", mode === "text" ? "true" : "false");
      document.getElementById("mode-json").setAttribute("aria-selected", mode === "json" ? "true" : "false");
      if (mode === "json") stateEl.placeholder = '{ "ticket": "..." }';
      else applyDeckHint();
      paintMeta();
    }
    function applyDeckHint() {
      if (deckId === "trade") {
        stateEl.placeholder = "Paste a blotter.";
        checksEl.textContent = "This pack: setup, side, size, haste.";
      } else if (deckId === "triage") {
        stateEl.placeholder = "Paste a message.";
        checksEl.textContent = "This pack: billing, tone, urgency.";
      } else {
        stateEl.placeholder = "Paste anything.";
        checksEl.textContent = "Whether to act, wait, or hand to a person.";
      }
    }
    function currentDeck() {
      return decks.find((deck) => deck.id === deckId) || null;
    }
    function setDeck(deck, keepState) {
      deckId = deck && deck.id ? deck.id : "custom";
      questions = clone((deck && deck.questions) || DEFAULT_QUESTIONS);
      order = Object.keys(questions);
      const deckSel = document.getElementById("decks");
      if (deckSel && deckSel.value !== deckId) deckSel.value = deckId;
      if (stateMode === "text") applyDeckHint();
      if (!keepState && deck && deck.sample && !stateEl.value.trim()) {
        stateEl.value = deck.sample;
        grow();
      }
      renderPack();
    }
    function addQuestion(type) {
      readAll();
      if (limits.max_questions && order.length >= limits.max_questions) {
        showError("at most " + limits.max_questions + " questions");
        return;
      }
      const id = nextId(type);
      questions[id] = blankQuestion(type);
      order.push(id);
      deckId = "custom";
      const deckSel = document.getElementById("decks");
      if (deckSel) deckSel.value = "";
      document.getElementById("advanced").open = true;
      renderPack();
    }
    function renameQuestion(from, to) {
      const id = String(to || "").trim();
      if (!id || id === from) return from;
      if (questions[id]) {
        showError("duplicate question id");
        return from;
      }
      questions[id] = questions[from];
      delete questions[from];
      order = order.map((name) => (name === from ? id : name));
      return id;
    }
    function changeType(id, type) {
      readAll();
      const prev = questions[id] || {};
      questions[id] = blankQuestion(type);
      questions[id].instructions = prev.instructions || questions[id].instructions;
      renderPack();
    }
    function removeQuestion(id) {
      readAll();
      delete questions[id];
      order = order.filter((name) => name !== id);
      renderPack();
    }
    function readChoice(id) {
      const spec = questions[id];
      if (!spec || spec.type !== "choice") return;
      const rows = qlistEl.querySelectorAll('[data-qid="' + CSS.escape(id) + '"] .opt');
      const criteria = {};
      rows.forEach((row) => {
        const key = row.querySelector(".okey").value.trim();
        if (!key) return;
        const desc = row.querySelector(".odesc").value.trim();
        criteria[key] = desc || null;
      });
      spec.criteria = criteria;
    }
    function readScore(id) {
      const spec = questions[id];
      if (!spec || spec.type !== "score") return;
      const levels = [];
      qlistEl.querySelectorAll('[data-qid="' + CSS.escape(id) + '"] .lvl input').forEach((input) => {
        const value = input.value.trim();
        if (value) levels.push(value);
      });
      spec.criteria = levels;
    }
    function readNoul(id) {
      const spec = questions[id];
      if (!spec || spec.type !== "noul") return;
      const card = qlistEl.querySelector('[data-qid="' + CSS.escape(id) + '"]');
      if (!card) return;
      const yes = card.querySelector(".qyes").value.trim();
      const no = card.querySelector(".qno").value.trim();
      if (!yes && !no) {
        delete spec.criteria;
        return;
      }
      spec.criteria = {};
      if (yes) spec.criteria.true = yes;
      if (no) spec.criteria.false = no;
    }
    function addOption(id) {
      readChoice(id);
      const spec = questions[id];
      if (!spec || spec.type !== "choice") return;
      if (limits.max_options && Object.keys(spec.criteria).length >= limits.max_options) {
        showError("at most " + limits.max_options + " options per choice/score");
        return;
      }
      spec.criteria[nextOptionKey(spec.criteria)] = "";
      renderPack();
    }
    function nextOptionKey(criteria) {
      let n = Object.keys(criteria).length + 1;
      let key = "opt_" + n;
      while (Object.prototype.hasOwnProperty.call(criteria, key)) {
        n += 1;
        key = "opt_" + n;
      }
      return key;
    }
    function addLevel(id) {
      readScore(id);
      const spec = questions[id];
      if (!spec || spec.type !== "score") return;
      if (limits.max_options && spec.criteria.length >= limits.max_options) {
        showError("at most " + limits.max_options + " options per choice/score");
        return;
      }
      spec.criteria.push("level_" + (spec.criteria.length + 1));
      renderPack();
    }
    function el(tag, attrs, children) {
      const node = document.createElement(tag);
      Object.entries(attrs || {}).forEach(([key, value]) => {
        if (key === "class") node.className = value;
        else if (value !== undefined && value !== null) node.setAttribute(key, value);
      });
      (children || []).forEach((child) => {
        if (typeof child === "string") node.appendChild(document.createTextNode(child));
        else if (child) node.appendChild(child);
      });
      return node;
    }
    function renderPack() {
      qlistEl.innerHTML = "";
      order.forEach((id) => {
        const spec = questions[id];
        if (!spec) return;
        const card = el("article", { class: "q", "data-qid": id });
        const idInput = el("input", { class: "qid", spellcheck: "false" });
        idInput.value = id;
        idInput.addEventListener("change", () => {
          const next = renameQuestion(card.getAttribute("data-qid"), idInput.value);
          card.setAttribute("data-qid", next);
        });
        const typeSel = el("select", { class: "qtype" }, [
          el("option", { value: "noul" }, ["Noul"]),
          el("option", { value: "choice" }, ["Choice"]),
          el("option", { value: "score" }, ["Score"])
        ]);
        typeSel.value = spec.type;
        typeSel.addEventListener("change", () => changeType(card.getAttribute("data-qid"), typeSel.value));
        const remove = el("button", { class: "ghost danger", type: "button" }, ["Remove"]);
        remove.addEventListener("click", () => removeQuestion(card.getAttribute("data-qid")));
        card.appendChild(el("header", {}, [idInput, typeSel, remove]));
        const ins = el("textarea", { class: "qins field", spellcheck: "false" });
        ins.value = spec.instructions || "";
        ins.addEventListener("input", () => {
          questions[card.getAttribute("data-qid")].instructions = ins.value;
        });
        card.appendChild(ins);
        if (spec.type === "noul") {
          const poles = noulPoles(spec.criteria);
          const yes = el("input", { class: "qyes", placeholder: "YES means…" });
          const no = el("input", { class: "qno", placeholder: "NO means…" });
          yes.value = poles.yes;
          no.value = poles.no;
          yes.addEventListener("input", () => readNoul(card.getAttribute("data-qid")));
          no.addEventListener("input", () => readNoul(card.getAttribute("data-qid")));
          card.appendChild(el("div", { class: "poles" }, [
            el("label", { class: "pole" }, [el("span", {}, ["YES"]), yes]),
            el("label", { class: "pole" }, [el("span", {}, ["NO"]), no])
          ]));
        } else if (spec.type === "choice") {
          const box = el("div", { class: "opts" });
          const entries = Object.entries(spec.criteria || {});
          entries.forEach(([key, desc]) => {
            const keyInput = el("input", { class: "okey", spellcheck: "false" });
            const descInput = el("input", { class: "odesc", placeholder: "optional description", spellcheck: "false" });
            keyInput.value = key;
            descInput.value = desc == null ? "" : String(desc);
            keyInput.addEventListener("input", () => readChoice(card.getAttribute("data-qid")));
            descInput.addEventListener("input", () => readChoice(card.getAttribute("data-qid")));
            const del = el("button", { class: "ghost danger", type: "button" }, ["−"]);
            del.disabled = entries.length <= 2;
            del.addEventListener("click", () => {
              const qid = card.getAttribute("data-qid");
              readChoice(qid);
              const keyNow = keyInput.value.trim() || key;
              const fresh = {};
              Object.entries(questions[qid].criteria || {}).forEach(([k, v]) => {
                if (k !== keyNow) fresh[k] = v;
              });
              if (Object.keys(fresh).length < 2) return;
              questions[qid].criteria = fresh;
              renderPack();
            });
            box.appendChild(el("div", { class: "opt" }, [keyInput, descInput, del]));
          });
          const add = el("button", { class: "ghost add-line", type: "button" }, ["Add option"]);
          add.addEventListener("click", () => addOption(card.getAttribute("data-qid")));
          box.appendChild(add);
          card.appendChild(box);
        } else {
          const box = el("div", { class: "lvls" });
          const levels = Array.isArray(spec.criteria) ? spec.criteria : [];
          levels.forEach((level, index) => {
            const input = el("input", { spellcheck: "false" });
            input.value = level;
            input.addEventListener("input", () => readScore(card.getAttribute("data-qid")));
            const del = el("button", { class: "ghost danger", type: "button" }, ["−"]);
            del.disabled = levels.length <= 2;
            del.addEventListener("click", () => {
              readScore(card.getAttribute("data-qid"));
              const qid = card.getAttribute("data-qid");
              if (questions[qid].criteria.length <= 2) return;
              questions[qid].criteria.splice(index, 1);
              renderPack();
            });
            box.appendChild(el("div", { class: "lvl" }, [input, del]));
          });
          const add = el("button", { class: "ghost add-line", type: "button" }, ["Add level"]);
          add.addEventListener("click", () => addLevel(card.getAttribute("data-qid")));
          box.appendChild(add);
          card.appendChild(box);
        }
        qlistEl.appendChild(card);
      });
      paintMeta();
    }
    function readAll() {
      order.forEach((id) => {
        readNoul(id);
        readChoice(id);
        readScore(id);
      });
    }
    function parseState() {
      const raw = stateEl.value;
      if (stateMode === "text") return raw;
      try {
        return JSON.parse(raw);
      } catch (err) {
        throw new Error("State JSON is not valid.");
      }
    }
    function currentPayload() {
      readAll();
      if (!order.length) throw new Error("Add at least one question.");
      const pack = {};
      order.forEach((id) => {
        const spec = questions[id];
        if (!spec || !String(spec.instructions || "").trim()) {
          throw new Error("Every question needs instructions.");
        }
        if (spec.type === "choice") {
          const keys = Object.keys(spec.criteria || {});
          if (keys.length < 2) throw new Error(id + " needs at least 2 options");
          if (limits.max_options && keys.length > limits.max_options) {
            throw new Error("at most " + limits.max_options + " options per choice/score");
          }
        }
        if (spec.type === "score") {
          const levels = spec.criteria || [];
          if (levels.length < 2) throw new Error(id + " needs at least 2 levels");
          if (limits.max_options && levels.length > limits.max_options) {
            throw new Error("at most " + limits.max_options + " options per choice/score");
          }
        }
        const row = { type: spec.type, instructions: spec.instructions };
        if (spec.type === "noul") {
          if (spec.criteria && (spec.criteria.true || spec.criteria.false)) row.criteria = spec.criteria;
        } else {
          row.criteria = spec.criteria;
        }
        pack[id] = row;
      });
      if (limits.max_questions && order.length > limits.max_questions) {
        throw new Error("at most " + limits.max_questions + " questions");
      }
      const state = parseState();
      const chars = typeof state === "string" ? state.length : JSON.stringify(state).length;
      if (limits.max_state_chars && chars > limits.max_state_chars) {
        throw new Error("state exceeds " + limits.max_state_chars + " characters");
      }
      const payload = { state: state, questions: pack };
      const model = modelEl.value.trim();
      if (model) payload.model = model;
      return payload;
    }
    function gateNoul(noul) {
      if (noul >= YES) return "yes";
      if (noul <= NO) return "no";
      return "unclear";
    }
    function gateChoice(answer) {
      if (!answer) return null;
      if (answer.confidence < CLEAR) return "unclear";
      return answer.choice;
    }
    function decideTriage(a) {
      const billing = gateNoul(a.billing ? a.billing.noul : 0);
      const tone = gateChoice(a.tone) || "calm";
      const urgency = a.urgency ? a.urgency.level : "can wait";
      const steps = [
        billing === "yes" ? "Billing desk" : billing === "no" ? "Not billing" : "Hold — billing unclear",
        tone === "unclear" ? "Hold — tone unclear" : "Tone: " + tone,
        urgency === "today" ? "Act today" : urgency === "this week" ? "This week" : "Can wait"
      ];
      if (billing === "unclear" || tone === "unclear") {
        return { kind: "hold", title: "Hold for a person", why: "A check did not clear 0.80 / 0.40.", steps: steps };
      }
      if (billing === "yes" && urgency === "today") {
        return { kind: "go", title: "Page billing now", why: "Billing ≥ 0.80 and urgency is today.", steps: steps };
      }
      if (billing === "yes") {
        const title = urgency === "this week" ? "Queue billing" : "Log billing, no rush";
        return { kind: "go", title: title, why: "Billing ≥ 0.80.", steps: steps };
      }
      if (tone === "angry" || tone === "frustrated") {
        return { kind: "hold", title: "Human review", why: "Not billing, but the tone is hot.", steps: steps };
      }
      return { kind: "stop", title: "Standard queue", why: "Not billing. No rush.", steps: steps };
    }
    function decideTrade(a) {
      const tradeable = gateNoul(a.tradeable ? a.tradeable.noul : 0);
      const side = gateChoice(a.side) || "stand_down";
      const size = a.size ? a.size.level : "skip";
      const haste = gateNoul(a.haste ? a.haste.noul : 0);
      const steps = [
        tradeable === "yes" ? "Setup is live" : tradeable === "no" ? "No setup" : "Hold — setup unclear",
        side === "unclear" ? "Hold — side unclear" : "Side: " + side.replace("_", " "),
        "Size: " + size,
        haste === "yes" ? "Next few minutes" : haste === "no" ? "Not immediate" : "Hold — haste unclear"
      ];
      const fire = tradeable === "yes" && side !== "stand_down" && side !== "unclear" && size !== "skip";
      if (tradeable === "unclear" || side === "unclear" || haste === "unclear") {
        return { kind: "hold", title: "Stand down — unclear", why: "A check did not clear 0.80 / 0.40.", steps: steps };
      }
      if (!fire) {
        return { kind: "stop", title: "Stand down", why: "No trade until setup, side, and size all clear.", steps: steps };
      }
      const title = haste === "yes" ? "Trade now · " + side + " · " + size : "Trade · " + side + " · " + size;
      return { kind: "go", title: title, why: "Tradeable ≥ 0.80, side is not stand down, size is not skip.", steps: steps };
    }
    function decideGeneral(a) {
      const actionable = gateNoul(a.actionable ? a.actionable.noul : 0);
      const next = gateChoice(a.next) || "wait";
      const urgency = a.urgency ? a.urgency.level : "later";
      const steps = [
        actionable === "yes" ? "Clear action" : actionable === "no" ? "No clear action" : "Hold — action unclear",
        next === "unclear" ? "Hold — next step unclear" : "Next: " + next,
        urgency === "now" ? "Now" : urgency === "soon" ? "Soon" : "Later"
      ];
      if (actionable === "unclear" || next === "unclear") {
        return { kind: "hold", title: "Hold for a person", why: "A check did not clear 0.80 / 0.40.", steps: steps };
      }
      if (next === "person") {
        return { kind: "hold", title: "Hold for a person", why: "Next step is a human.", steps: steps };
      }
      if (next === "ignore" || (actionable === "no" && next !== "act")) {
        return { kind: "stop", title: "Stand down", why: "Nothing to do.", steps: steps };
      }
      if (next === "wait") {
        return { kind: "hold", title: "Wait", why: "Park it.", steps: steps };
      }
      if (urgency === "now") {
        return { kind: "go", title: "Act now", why: "Actionable ≥ 0.80 and urgency is now.", steps: steps };
      }
      return { kind: "go", title: "Act", why: "There is a clear next step.", steps: steps };
    }
    function decide(answers) {
      if (answers.tradeable) return decideTrade(answers);
      if (answers.billing) return decideTriage(answers);
      if (answers.actionable || answers.next) return decideGeneral(answers);
      return null;
    }
    function pct(v) { return (Number(v) * 100).toFixed(0) + "%"; }
    function noulCard(id, a) {
      const gate = gateNoul(a.noul);
      const w = Math.max(0, Math.min(100, a.noul * 100));
      return '<article class="card"><header><span class="id">' + escapeText(id) + '</span><span class="readout">' + gate + '</span></header><div class="noul-track"><div class="noul-fill" style="width:' + w + '%"></div><div class="noul-rule" title="yes at 0.80"></div></div><p class="conf">' + a.noul.toFixed(2) + ' · yes at 0.80</p></article>';
    }
    function choiceCard(id, a) {
      const pick = gateChoice(a);
      const rows = Object.entries(a.probabilities || {}).map(([label, p]) => {
        const win = label === a.choice ? " win" : "";
        return '<div class="bar-row' + win + '"><span class="lab">' + escapeText(label.replaceAll("_", " ")) + '</span><div class="bar"><i style="width:' + (p * 100) + '%"></i></div><span>' + pct(p) + '</span></div>';
      }).join("");
      const shown = pick === "unclear" ? "unclear" : String(a.choice).replaceAll("_", " ");
      return '<article class="card"><header><span class="id">' + escapeText(id) + '</span><span class="readout">' + escapeText(shown) + '</span></header>' + rows + '<p class="conf">needs 0.40 to count</p></article>';
    }
    function scoreCard(id, a) {
      const n = (a.levels || []).length;
      const ticks = (a.levels || []).map((level) => "<span>" + escapeText(level) + "</span>").join("");
      const left = n <= 1 ? 0 : (a.score / (n - 1)) * 100;
      return '<article class="card"><header><span class="id">' + escapeText(id) + '</span><span class="readout">' + escapeText(String(a.level)) + '</span></header><div class="score-track">' + ticks + '<div class="needle" style="left:' + left + '%"></div></div></article>';
    }
    function paintTape() {
      tapeEl.innerHTML = "";
      tape.forEach((row, index) => {
        const elBtn = document.createElement("button");
        elBtn.type = "button";
        elBtn.innerHTML = "<b></b><span></span>";
        elBtn.querySelector("b").textContent = row.headline;
        elBtn.querySelector("span").textContent = row.ms.toFixed(0) + " ms";
        elBtn.addEventListener("click", () => {
          const turns = instrumentsEl.querySelectorAll(".turn");
          const target = turns[turns.length - 1 - index];
          if (target) target.scrollIntoView({ block: "start" });
        });
        tapeEl.appendChild(elBtn);
      });
    }
    function renderAnswers(text, body, payload) {
      helloEl.classList.add("gone");
      const call = decide(body.answers);
      const cards = Object.entries(body.answers).map(([id, a]) => {
        if (a.type === "noul") return noulCard(id, a);
        if (a.type === "choice") return choiceCard(id, a);
        return scoreCard(id, a);
      });
      const u = body.usage;
      const turn = document.createElement("section");
      turn.className = "turn";
      const title = call ? call.title : "KEV";
      const why = call ? call.why : "";
      const steps = call
        ? (call.steps || []).map((line) => "<li>" + escapeText(line) + "</li>").join("")
        : "";
      const kind = call ? call.kind : "";
      turn.innerHTML =
        '<div class="you"><div class="bubble"></div></div>' +
        '<article class="verdict ' + kind + '"><div class="who">KEV</div><h2>' + escapeText(title) + '</h2>' +
        (why ? '<p class="why">' + escapeText(why) + "</p>" : "") +
        (steps ? '<ul class="steps">' + steps + "</ul>" : "") + "</article>" +
        '<div class="meters">' + cards.join("") + "</div>" +
        '<p class="conf">' + u.latency_ms.toFixed(0) + " ms</p>" +
        '<details class="wire"><summary>request</summary><pre></pre></details>' +
        '<details class="wire"><summary>answers</summary><pre></pre></details>';
      turn.querySelector(".bubble").textContent = text;
      const pres = turn.querySelectorAll("details.wire pre");
      pres[0].textContent = "POST /v1/systemone\n" + JSON.stringify(payload, null, 2);
      pres[1].textContent = JSON.stringify(
        { id: body.id, model: body.model, answers: body.answers, usage: body.usage },
        null,
        2
      );
      instrumentsEl.appendChild(turn);
      feedEl.scrollTop = feedEl.scrollHeight;
      tape.unshift({ headline: title, ms: u.latency_ms });
      tape.splice(24);
      paintTape();
    }
    function showError(msg) {
      helloEl.classList.add("gone");
      const turn = document.createElement("section");
      turn.className = "turn";
      const card = document.createElement("article");
      card.className = "card err";
      card.innerHTML = "<header><span class='id'>couldn’t decide</span></header><p></p>";
      card.querySelector("p").textContent = msg;
      turn.appendChild(card);
      instrumentsEl.appendChild(turn);
      feedEl.scrollTop = feedEl.scrollHeight;
    }
    function resetThread() {
      instrumentsEl.innerHTML = "";
      helloEl.classList.remove("gone");
      tape.length = 0;
      paintTape();
      stateEl.value = "";
      modelEl.value = "";
      document.getElementById("advanced").open = false;
      setStateMode("text");
      const first = decks.find((d) => d.id === "general") || { id: "general", questions: DEFAULT_QUESTIONS };
      setDeck(first, true);
      grow();
      stateEl.focus();
    }
    function exportPack() {
      try {
        const payload = currentPayload();
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "kev-systemone.json";
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        showError(err.message || String(err));
      }
    }
    function applyImported(raw) {
      const body = typeof raw === "string" ? JSON.parse(raw) : raw;
      const pack = body.questions || body;
      if (!pack || typeof pack !== "object" || Array.isArray(pack)) {
        throw new Error("Import a questions object or a full systemone payload.");
      }
      questions = clone(pack);
      order = Object.keys(questions);
      deckId = "custom";
      if (Object.prototype.hasOwnProperty.call(body, "state")) {
        if (typeof body.state === "string") {
          setStateMode("text");
          stateEl.value = body.state;
        } else {
          setStateMode("json");
          stateEl.value = JSON.stringify(body.state, null, 2);
        }
      }
      if (typeof body.model === "string") modelEl.value = body.model;
      const deckSel = document.getElementById("decks");
      if (deckSel) deckSel.value = "";
      document.getElementById("advanced").open = true;
      renderPack();
      grow();
    }
    async function judge() {
      const text = stateEl.value.trim();
      judgeBtn.disabled = true;
      busyEl.textContent = "working…";
      try {
        if (stateMode === "text" && !text) {
          throw new Error("Paste something first.");
        }
        const payload = currentPayload();
        const response = await fetch("/v1/systemone", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(payload)
        });
        const body = await response.json();
        if (!response.ok) {
          const detail = typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail || body);
          throw new Error(detail);
        }
        renderAnswers(stateMode === "text" ? text : JSON.stringify(payload.state), body, payload);
        if (stateMode === "text") {
          stateEl.value = "";
          grow();
        }
      } catch (err) {
        showError(err.message || String(err));
      } finally {
        judgeBtn.disabled = false;
        busyEl.textContent = "";
        stateEl.focus();
      }
    }
    document.getElementById("judge").addEventListener("click", () => { void judge(); });
    document.getElementById("new").addEventListener("click", resetThread);
    document.getElementById("add-noul").addEventListener("click", () => addQuestion("noul"));
    document.getElementById("add-choice").addEventListener("click", () => addQuestion("choice"));
    document.getElementById("add-score").addEventListener("click", () => addQuestion("score"));
    document.getElementById("export").addEventListener("click", exportPack);
    document.getElementById("import").addEventListener("click", () => importFile.click());
    document.getElementById("sample").addEventListener("click", () => {
      const deck = currentDeck();
      if (deck && deck.sample) {
        if (stateMode === "json") {
          const key = deck.state_key || "text";
          stateEl.value = JSON.stringify({ [key]: deck.sample }, null, 2);
        } else {
          stateEl.value = deck.sample;
        }
        grow();
        paintMeta();
      }
    });
    importFile.addEventListener("change", async () => {
      const file = importFile.files && importFile.files[0];
      importFile.value = "";
      if (!file) return;
      try {
        applyImported(await file.text());
      } catch (err) {
        showError(err.message || String(err));
      }
    });
    document.getElementById("mode-text").addEventListener("click", () => setStateMode("text"));
    document.getElementById("mode-json").addEventListener("click", () => setStateMode("json"));
    stateEl.addEventListener("input", () => { grow(); paintMeta(); });
    stateEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        void judge();
      }
    });
    document.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
        event.preventDefault();
        void judge();
      }
    });
    (async function boot() {
      try {
        const health = await fetch("/healthz");
        const pill = document.getElementById("health-pill");
        if (health.ok) { pill.textContent = "live"; pill.className = "pill ok"; }
        else { pill.textContent = "down"; pill.className = "pill bad"; }
      } catch (err) {
        const pill = document.getElementById("health-pill");
        pill.textContent = "down";
        pill.className = "pill bad";
      }
      try {
        const v1 = await fetch("/v1");
        if (v1.ok) {
          const body = await v1.json();
          if (body.limits) setLimits(body.limits);
          document.getElementById("auth-pill").textContent = body.auth === "bearer" ? "bearer" : "open";
        }
      } catch (err) { /* defaults remain */ }
      try {
        const meta = await fetch("/v1/meta");
        if (meta.ok) {
          const body = await meta.json();
          document.getElementById("model-pill").textContent = body.model || "model";
          modelEl.placeholder = body.model || "Bound server model";
          if (body.limits) setLimits(body.limits);
        }
      } catch (err) { /* bound model unknown */ }
      try {
        const deckRes = await fetch("/v1/decks");
        if (deckRes.ok) {
          const payload = await deckRes.json();
          decks = payload.decks || [];
        }
      } catch (err) { decks = []; }
      if (!decks.length) {
        decks = [{ id: "general", title: "Text", questions: DEFAULT_QUESTIONS }];
      }
      const root = document.getElementById("decks");
      root.innerHTML = "";
      root.appendChild(el("option", { value: "" }, ["custom"]));
      decks.forEach((deck) => {
        root.appendChild(el("option", { value: deck.id }, [deck.title || deck.id]));
      });
      root.addEventListener("change", () => {
        const picked = decks.find((deck) => deck.id === root.value);
        if (picked) setDeck(picked, true);
      });
      const first = decks.find((d) => d.id === "general") || decks[0];
      setDeck(first, true);
      grow();
    })();
  </script>
